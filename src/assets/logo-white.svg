  <rect width="48" height="48" rx="12" fill="white"/>
  
  <!-- Upward trend bars -->
  <rect x="10" y="30" width="6" height="8" rx="1.5" fill="hsl(152, 69%, 31%)" opacity="0.5"/>
  <rect x="19" y="24" width="6" height="14" rx="1.5" fill="hsl(152, 69%, 31%)" opacity="0.7"/>
  <rect x="28" y="16" width="6" height="22" rx="1.5" fill="hsl(152, 69%, 31%)"/>
  
  <!-- Peak arrow / growth indicator -->
  <path d="M36 14 L40 10 L40 16" stroke="hsl(152, 69%, 31%)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
